name: SentinelOne CNS Scan

on:
  # Scan pull requests targeting the fork's default branch.
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: read

env:
  TARGET_IMAGE: ghcr.io/loft-sh/vcluster-oss@sha256:7327a764bbb077df8efe7500196aad3c4488ab5e5c05b327d240430baa3acf52

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  s1-shift-left-cli:
    name: SentinelOne scans (advisory)
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      secret-outcome: ${{ steps.secret-detector.outcome }}
      iac-outcome: ${{ steps.iac-scanner.outcome }}
      source-vuln-outcome: ${{ steps.vuln-scanner.outcome }}
      image-vuln-outcome: ${{ steps.image-vuln-scanner.outcome }}
      image-scan-completed: ${{ steps.image-vuln-scanner.outputs.scan-completed }}
      image-scanner-exit-code: ${{ steps.image-vuln-scanner.outputs.scanner-exit-code }}
      image-critical-count: ${{ steps.image-vuln-scanner.outputs.critical-count }}
      image-high-count: ${{ steps.image-vuln-scanner.outputs.high-count }}
      image-medium-count: ${{ steps.image-vuln-scanner.outputs.medium-count }}
      image-low-count: ${{ steps.image-vuln-scanner.outputs.low-count }}
      image-total-count: ${{ steps.image-vuln-scanner.outputs.total-count }}
      image-unique-id-count: ${{ steps.image-vuln-scanner.outputs.unique-id-count }}
      image-go-finding-count: ${{ steps.image-vuln-scanner.outputs.go-finding-count }}
      image-os-finding-count: ${{ steps.image-vuln-scanner.outputs.os-finding-count }}
      image-os-unique-id-count: ${{ steps.image-vuln-scanner.outputs.os-unique-id-count }}
    container:
      image: pingsafe/s1-shift-left-cli@sha256:1bceb426867bd3389fcff6174d06e6bfee23f029903d8d006a52444e12867c06 # 1.0.4
      options: --entrypoint ""

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Configure SentinelOne Shift Left CLI
        env:
          S1_SERVICE_USER_API_TOKEN: ${{ secrets.S1_SERVICE_USER_API_TOKEN }}
          S1_MANAGEMENT_CONSOLE_URL: ${{ secrets.S1_MANAGEMENT_CONSOLE_URL }}
          S1_SCOPE_ID: ${{ secrets.S1_SCOPE_ID }}
          S1_POLICY_ID: ${{ secrets.S1_POLICY_ID }}
        run: >-
          s1-cns-cli config
          --service-user-api-token "$S1_SERVICE_USER_API_TOKEN"
          --management-console-url "$S1_MANAGEMENT_CONSOLE_URL"
          --scope-type ACCOUNT
          --scope-id "$S1_SCOPE_ID"
          --policy-id "$S1_POLICY_ID"

      - name: Configure git safe directory
        run: git config --global --add safe.directory "$PWD"

      - name: Run Secret Detector
        id: secret-detector
        continue-on-error: true
        env:
          DEST: ${{ github.event.pull_request.base.sha }}
          SRC: ${{ github.event.pull_request.head.ref }}
          REPO_FULL_NAME: ${{ github.repository }}
          REPO_URL: ${{ github.server_url }}
        run: >-
          s1-cns-cli scan secret
          -d "$PWD"
          --pull-request "origin/$SRC" "$DEST"
          --publish-result
          --repo-full-name "$REPO_FULL_NAME"
          --repo-url "$REPO_URL/$REPO_FULL_NAME"
          --provider GITHUB

      - name: Run IaC Scanner
        id: iac-scanner
        continue-on-error: true
        env:
          REPO_FULL_NAME: ${{ github.repository }}
          REPO_URL: ${{ github.server_url }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: >-
          s1-cns-cli scan iac
          -d "$PWD"
          --publish-result
          --repo-full-name "$REPO_FULL_NAME"
          --repo-url "$REPO_URL/$REPO_FULL_NAME"
          --branch "$BRANCH"
          --provider GITHUB

      - name: Run Vulnerability Scanner
        id: vuln-scanner
        continue-on-error: true
        run: s1-cns-cli scan vuln -d "$PWD"

      - name: Run Container Image Vulnerability Scanner
        id: image-vuln-scanner
        continue-on-error: true
        run: .github/scripts/run-s1-image-vuln-scan.sh

  snyk-container-scan:
    name: Snyk container image scan
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      scan-outcome: ${{ steps.snyk-scan.outcome }}
      scanner-error: ${{ steps.snyk-scan.outputs.scanner-error }}
      has-vulnerabilities: ${{ steps.snyk-scan.outputs.has-vulnerabilities }}
      critical-count: ${{ steps.snyk-scan.outputs.critical-count }}
      high-count: ${{ steps.snyk-scan.outputs.high-count }}
      medium-count: ${{ steps.snyk-scan.outputs.medium-count }}
      low-count: ${{ steps.snyk-scan.outputs.low-count }}
      total-count: ${{ steps.snyk-scan.outputs.threshold-count }}

    steps:
      - name: Scan container image with Snyk
        id: snyk-scan
        uses: loft-sh/github-actions/.github/actions/cve-scan@cve-scan/v1 # zizmor: ignore[unpinned-uses] -- internal loft-sh action, pinned by its rolling action-specific tag
        with:
          image-ref: ${{ env.TARGET_IMAGE }}
          severity-threshold: low
          block-on-findings: false
          notify: false
          scanner-token: ${{ secrets.SNYK_TOKEN }}

  mend-container-scan:
    name: Mend container image scan
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      scan-outcome: ${{ steps.mend-scan.outcome }}
      scan-completed: ${{ steps.mend-scan.outputs.scan-completed }}
      scanner-exit-code: ${{ steps.mend-scan.outputs.scanner-exit-code }}
      critical-count: ${{ steps.mend-scan.outputs.critical-count }}
      high-count: ${{ steps.mend-scan.outputs.high-count }}
      medium-count: ${{ steps.mend-scan.outputs.medium-count }}
      low-count: ${{ steps.mend-scan.outputs.low-count }}
      total-count: ${{ steps.mend-scan.outputs.total-count }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install verified Mend CLI
        run: .github/scripts/setup-mend-cli.sh

      - name: Scan container image with Mend and publish to Mend
        id: mend-scan
        continue-on-error: true
        env:
          MEND_URL: ${{ secrets.MEND_URL }}
          MEND_EMAIL: ${{ secrets.MEND_EMAIL }}
          MEND_USER_KEY: ${{ secrets.MEND_USER_KEY }}
          MEND_ORGANIZATION: ${{ secrets.MEND_ORGANIZATION }}
          MEND_BASE_DIR: ${{ runner.temp }}/mend-home
        run: .github/scripts/run-mend-image-vuln-scan.sh

  consolidate-results:
    name: Consolidated scan summary
    if: always()
    needs: [s1-shift-left-cli, snyk-container-scan, mend-container-scan]
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Write comparison summary
        env:
          SUMMARY: |
            # Security scan comparison

            Image: `${{ env.TARGET_IMAGE }}`

            ## Scanner execution

            | Scanner | Scope | CLI outcome |
            |---------|-------|-------------|
            | SentinelOne | Secrets | `${{ needs.s1-shift-left-cli.outputs.secret-outcome || needs.s1-shift-left-cli.result }}` |
            | SentinelOne | IaC | `${{ needs.s1-shift-left-cli.outputs.iac-outcome || needs.s1-shift-left-cli.result }}` |
            | SentinelOne | Source dependencies | `${{ needs.s1-shift-left-cli.outputs.source-vuln-outcome == 'failure' && 'non-zero — findings or scan error' || needs.s1-shift-left-cli.outputs.source-vuln-outcome || needs.s1-shift-left-cli.result }}` |
            | SentinelOne | Container image | `${{ needs.s1-shift-left-cli.outputs.image-scan-completed == 'true' && 'completed' || 'scanner error' }}` |
            | Snyk | Container image | `${{ needs.snyk-container-scan.outputs.scanner-error == 'false' && 'completed' || 'scanner error' }}` |
            | Mend | Container image | `${{ needs.mend-container-scan.outputs.scan-completed == 'true' && 'completed; UI publication requested' || 'scanner error' }}` |

            ## Container results and counting models

            > **The reported totals are not directly comparable and are not a scanner-quality
            > score.** The tools use different dependency discovery, deduplication, vulnerability
            > databases, severity mappings, and suppression policies. A higher total does not by
            > itself mean that a scanner detected more distinct vulnerabilities.

            | Scanner | Reported total | Unique vulnerability IDs | What the total represents |
            |---------|---------------:|-------------------------:|---------------------------|
            | SentinelOne | ${{ needs.s1-shift-left-cli.outputs.image-total-count || 'n/a' }} | ${{ needs.s1-shift-left-cli.outputs.image-unique-id-count || 'n/a' }} | Package-level finding instances: ${{ needs.s1-shift-left-cli.outputs.image-go-finding-count || 'n/a' }} compiled-Go and ${{ needs.s1-shift-left-cli.outputs.image-os-finding-count || 'n/a' }} OS-package instances; the OS rows represent ${{ needs.s1-shift-left-cli.outputs.image-os-unique-id-count || 'n/a' }} unique IDs. |
            | Snyk | ${{ needs.snyk-container-scan.outputs.total-count || 'n/a' }} | Not exposed by the current adapter | Snyk-reported findings after its own normalization. |
            | Mend | ${{ needs.mend-container-scan.outputs.total-count || 'n/a' }} | Not yet normalized | Vulnerability rows in the Mend CLI terminal table; the CLI also requests publication to the configured Mend organization. |

            SentinelOne's Go/OS split is a reporting heuristic based on package coordinates in its
            CLI table. Snyk and Mend do not currently expose the same breakdown to this workflow.
            Therefore, these totals must not be used to claim that one scanner detected more than
            another. A detection comparison requires matching vulnerability IDs and affected
            package ecosystems across all three scanners.

            ## Raw severity totals (not normalized)

            | Severity | SentinelOne instances | Snyk findings | Mend rows |
            |----------|----------------------:|--------------:|----------:|
            | Critical | ${{ needs.s1-shift-left-cli.outputs.image-critical-count || 'n/a' }} | ${{ needs.snyk-container-scan.outputs.critical-count || 'n/a' }} | ${{ needs.mend-container-scan.outputs.critical-count || 'n/a' }} |
            | High | ${{ needs.s1-shift-left-cli.outputs.image-high-count || 'n/a' }} | ${{ needs.snyk-container-scan.outputs.high-count || 'n/a' }} | ${{ needs.mend-container-scan.outputs.high-count || 'n/a' }} |
            | Medium | ${{ needs.s1-shift-left-cli.outputs.image-medium-count || 'n/a' }} | ${{ needs.snyk-container-scan.outputs.medium-count || 'n/a' }} | ${{ needs.mend-container-scan.outputs.medium-count || 'n/a' }} |
            | Low | ${{ needs.s1-shift-left-cli.outputs.image-low-count || 'n/a' }} | ${{ needs.snyk-container-scan.outputs.low-count || 'n/a' }} | ${{ needs.mend-container-scan.outputs.low-count || 'n/a' }} |
            | **Total** | **${{ needs.s1-shift-left-cli.outputs.image-total-count || 'n/a' }}** | **${{ needs.snyk-container-scan.outputs.total-count || 'n/a' }}** | **${{ needs.mend-container-scan.outputs.total-count || 'n/a' }}** |

            See the individual job logs, SentinelOne console, and Mend UI for scanner-specific details.
        run: printf '%s\n' "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"
