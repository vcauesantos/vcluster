name: SentinelOne CNS Scan

on:
  # Scan pull requests targeting the fork's default branch.
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: read

env:
  TARGET_IMAGE: ghcr.io/loft-sh/vcluster-oss@sha256:7327a764bbb077df8efe7500196aad3c4488ab5e5c05b327d240430baa3acf52

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  s1-shift-left-cli:
    name: SentinelOne scans (advisory)
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      secret-outcome: ${{ steps.secret-detector.outcome }}
      iac-outcome: ${{ steps.iac-scanner.outcome }}
      source-vuln-outcome: ${{ steps.vuln-scanner.outcome }}
      image-vuln-outcome: ${{ steps.image-vuln-scanner.outcome }}
    container:
      image: pingsafe/s1-shift-left-cli@sha256:1bceb426867bd3389fcff6174d06e6bfee23f029903d8d006a52444e12867c06 # 1.0.4
      options: --entrypoint ""

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Configure SentinelOne Shift Left CLI
        env:
          S1_SERVICE_USER_API_TOKEN: ${{ secrets.S1_SERVICE_USER_API_TOKEN }}
          S1_MANAGEMENT_CONSOLE_URL: ${{ secrets.S1_MANAGEMENT_CONSOLE_URL }}
          S1_SCOPE_ID: ${{ secrets.S1_SCOPE_ID }}
          S1_POLICY_ID: ${{ secrets.S1_POLICY_ID }}
        run: >-
          s1-cns-cli config
          --service-user-api-token "$S1_SERVICE_USER_API_TOKEN"
          --management-console-url "$S1_MANAGEMENT_CONSOLE_URL"
          --scope-type ACCOUNT
          --scope-id "$S1_SCOPE_ID"
          --policy-id "$S1_POLICY_ID"

      - name: Configure git safe directory
        run: git config --global --add safe.directory "$PWD"

      - name: Run Secret Detector
        id: secret-detector
        continue-on-error: true
        env:
          DEST: ${{ github.event.pull_request.base.sha }}
          SRC: ${{ github.event.pull_request.head.ref }}
          REPO_FULL_NAME: ${{ github.repository }}
          REPO_URL: ${{ github.server_url }}
        run: >-
          s1-cns-cli scan secret
          -d "$PWD"
          --pull-request "origin/$SRC" "$DEST"
          --publish-result
          --repo-full-name "$REPO_FULL_NAME"
          --repo-url "$REPO_URL/$REPO_FULL_NAME"
          --provider GITHUB

      - name: Run IaC Scanner
        id: iac-scanner
        continue-on-error: true
        env:
          REPO_FULL_NAME: ${{ github.repository }}
          REPO_URL: ${{ github.server_url }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: >-
          s1-cns-cli scan iac
          -d "$PWD"
          --publish-result
          --repo-full-name "$REPO_FULL_NAME"
          --repo-url "$REPO_URL/$REPO_FULL_NAME"
          --branch "$BRANCH"
          --provider GITHUB

      - name: Run Vulnerability Scanner
        id: vuln-scanner
        continue-on-error: true
        run: s1-cns-cli scan vuln -d "$PWD"

      - name: Run Container Image Vulnerability Scanner
        id: image-vuln-scanner
        continue-on-error: true
        run: >-
          s1-cns-cli scan vuln
          --docker-image "$TARGET_IMAGE"

  snyk-container-scan:
    name: Snyk container image scan
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      scan-outcome: ${{ steps.snyk-scan.outcome }}
      scanner-error: ${{ steps.snyk-scan.outputs.scanner-error }}
      has-vulnerabilities: ${{ steps.snyk-scan.outputs.has-vulnerabilities }}
      critical-count: ${{ steps.snyk-scan.outputs.critical-count }}
      high-count: ${{ steps.snyk-scan.outputs.high-count }}
      medium-count: ${{ steps.snyk-scan.outputs.medium-count }}
      low-count: ${{ steps.snyk-scan.outputs.low-count }}

    steps:
      - name: Scan container image with Snyk
        id: snyk-scan
        uses: loft-sh/github-actions/.github/actions/cve-scan@cve-scan/v1 # zizmor: ignore[unpinned-uses] -- internal loft-sh action, pinned by its rolling action-specific tag
        with:
          image-ref: ${{ env.TARGET_IMAGE }}
          severity-threshold: low
          block-on-findings: false
          notify: false
          scanner-token: ${{ secrets.SNYK_TOKEN }}

  consolidate-results:
    name: Consolidated scan summary
    if: always()
    needs: [s1-shift-left-cli, snyk-container-scan]
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Write comparison summary
        env:
          SUMMARY: |
            # Security scan comparison

            Image: `${{ env.TARGET_IMAGE }}`

            ## Scanner execution

            | Scanner | Scope | CLI outcome |
            |---------|-------|-------------|
            | SentinelOne | Secrets | `${{ needs.s1-shift-left-cli.outputs.secret-outcome || needs.s1-shift-left-cli.result }}` |
            | SentinelOne | IaC | `${{ needs.s1-shift-left-cli.outputs.iac-outcome || needs.s1-shift-left-cli.result }}` |
            | SentinelOne | Source dependencies | `${{ needs.s1-shift-left-cli.outputs.source-vuln-outcome == 'failure' && 'non-zero — findings or scan error' || needs.s1-shift-left-cli.outputs.source-vuln-outcome || needs.s1-shift-left-cli.result }}` |
            | SentinelOne | Container image | `${{ needs.s1-shift-left-cli.outputs.image-vuln-outcome == 'failure' && 'non-zero — findings or scan error' || needs.s1-shift-left-cli.outputs.image-vuln-outcome || needs.s1-shift-left-cli.result }}` |
            | Snyk | Container image | `${{ needs.snyk-container-scan.outputs.scan-outcome || needs.snyk-container-scan.result }}` |
            | Snyk | Scanner error | `${{ needs.snyk-container-scan.outputs.scanner-error || 'n/a' }}` |
            | Snyk | Findings at threshold | `${{ needs.snyk-container-scan.outputs.has-vulnerabilities || 'n/a' }}` |

            ## Snyk container findings

            | Severity | Count |
            |----------|-------|
            | Critical | ${{ needs.snyk-container-scan.outputs.critical-count || 'n/a' }} |
            | High | ${{ needs.snyk-container-scan.outputs.high-count || 'n/a' }} |
            | Medium | ${{ needs.snyk-container-scan.outputs.medium-count || 'n/a' }} |
            | Low | ${{ needs.snyk-container-scan.outputs.low-count || 'n/a' }} |

            SentinelOne returns a non-zero exit code when some scanners find issues. CLI
            outcomes do not represent finding counts and are advisory for this POV. See the
            individual job logs and SentinelOne console for the detailed findings.
        run: printf '%s\n' "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"
